[project]
name = "euclib"
version = "0.1.0.dev1"
readme = "README.md"
authors = [{name="Noah C. Benson", email="nben@uw.edu"}]
license = {"text"="MIT"}
readme = "README.md"
requires-python = ">=3.8"
keywords = ["persistent", "immutable", "functional", "scientific", "geometry"]
classifiers = [
    'Intended Audience :: Science/Research',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Topic :: Software Development',
    'Topic :: Software Development :: Libraries',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Scientific/Engineering',
    'Topic :: Scientific/Engineering :: Information Analysis',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Operating System :: Unix',
    'Operating System :: MacOS']
dependencies = [
     'immlib >= 0.1.0']

[project.optional-dependencies]
dev = ["torch >= 2.2.0", "pyyaml"]
test = ["torch >= 2.2.0", "pyyaml"]

[project.urls]
homepage = "https://github.com/noahbenson/euclib"
documentation = "https://github.com/noahbenson/euclib"
repository = "https://github.com/noahbenson/euclib"

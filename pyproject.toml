[build-system]
# setuptools 77 is the first release that understands PEP 639 SPDX license
# expressions; the "License ::" classifiers are superseded by the `license`
# field below and are rejected outright by setuptools 80+.
#
# numpy is needed to *build* the optional euclib._c._core extension, because
# setup.py asks it for the include directory its headers live in. Without it
# here, a build under isolation cannot compile the extension and quietly falls
# back to the pure-Python kernels --- a working installation that is missing the
# speedup, and a silent one. A machine with no compiler still gets that fallback
# by design; a machine with a compiler and no numpy here would get it by
# accident. It is listed under `dependencies` below as well, since the compiled
# extension imports numpy at run time.
requires = ["setuptools >= 77", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "euclib"
version = "0.1.0.dev1"
description = "A library for tracking data associated with 2D/3D Euclidean space"
readme = "README.md"
authors = [{name = "Noah C. Benson", email = "nben@uw.edu"}]
license = "MIT"
requires-python = ">=3.10"
keywords = ["persistent", "immutable", "functional", "scientific", "geometry"]
classifiers = [
    'Intended Audience :: Science/Research',
    'Intended Audience :: Developers',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Software Development',
    'Topic :: Software Development :: Libraries',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Scientific/Engineering',
    'Topic :: Scientific/Engineering :: Information Analysis',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Operating System :: Unix',
    'Operating System :: MacOS']
dependencies = [
    'immlib >= 1.0',
    'pcollections >= 1.0',
    'docshare >= 1.0',
    'numpy',
    'joblib']

[project.optional-dependencies]
torch = ["torch >= 2.2"]
quant = ["pint >= 0.24,<0.27"]
test = ["torch >= 2.2", "pint >= 0.24,<0.27"]
dev = ["euclib[test]", "ruff", "build"]
# The docs build on Jupyter Book 2 (mystmd) and execute the example pages, so
# the plotting dependencies are needed to render the figures. The API
# reference is generated by docs/generate_api.py, which uses docshare.
docs = ["jupyter-book >= 2", "matplotlib >= 3.4", "k3d >= 2.16", "ipykernel",
        "numpy", "docshare >= 0.2.0"]

[project.urls]
homepage = "https://github.com/noahbenson/euclib"
documentation = "https://noahbenson.github.io/euclib/"
repository = "https://github.com/noahbenson/euclib"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
euclib = ["py.typed"]

################################################################################
# myst.yml
#
# Jupyter Book 2 configuration. Jupyter Book 2 builds with mystmd and uses the
# myst.yml format (version 1) rather than the Jupyter Book 1 _config.yml and
# _toc.yml files; this mirrors the layout already used by immlib's docs.
#
# Build from this directory (the site root):
#
#     jupyter-book build --html [--execute]
#
version: 1

project:
  title: "euclib: Data in 2D and 3D Euclidean Space"
  authors:
    - name: Noah C. Benson
      email: nben@uw.edu
  copyright: "2026"
  github: https://github.com/noahbenson/euclib
  toc:
    - file: intro.md
    - title: Introduction
      children:
        - file: intro/about.md
        - file: intro/getting-started.md
        - file: intro/design.md
        - file: license.md
    - title: Examples
      children:
        - file: examples/index.md
        - title: Construction
          children:
            - file: examples/construction/constructors.md
        - title: Primitives
          children:
            - file: examples/primitives/cube.md
            - file: examples/primitives/spheres.md
            - file: examples/primitives/circles-and-ellipses.md
            - file: examples/primitives/circular-arcs.md
            - file: examples/primitives/revolution.md
            - file: examples/primitives/prism-sweeps.md
            - file: examples/primitives/tetrahedral-meshes.md
        - title: Surfaces and Paths
          children:
            - file: examples/surfaces/geodesic.md
        - title: Intersections
          children:
            - file: examples/intersections/mesh-mesh.md
            - file: examples/intersections/path-mesh.md
            - file: examples/intersections/path-path.md
            - file: examples/intersections/mesh-grid.md
        - title: Transforms
          children:
            - file: examples/transforms/affine-transforms.md
            - file: examples/transforms/axis-angle-and-reflection.md
        - title: Properties and Interpolation
          children:
            - file: examples/properties/point-clouds.md
            - file: examples/properties/interpolation.md
            - file: examples/properties/transfer.md
            - file: examples/properties/immutability.md
        - title: Grids and Images
          children:
            - file: examples/grids/grids-from-arrays.md
        - title: Queries and Measures
          children:
            - file: examples/queries/measures.md
            - file: examples/queries/nearest-points.md
            - file: examples/queries/distance-and-separation.md
            - file: examples/queries/containment.md
        - file: examples/roadmap.md
    # The API-reference pages are generated by docs/generate_api.py, which is
    # run before the book is built.
    - title: API Reference
      children:
        - file: api.md
        - file: api/euclib.md
        - file: api/euclib-types.md
        - file: api/euclib-ops.md
        - file: api/euclib-utils.md
        - file: api/euclib-abc.md

site:
  template: book-theme
